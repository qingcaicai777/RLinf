policy:
  config_name: "pi05_flexiv_rtc"
  checkpoint_path: "/path/to/standard_openpi_jax_sft_checkpoint"
  prompt: "Pick up the black cylindrical peg and insert it into the hole on the dodecahedral fixture"
  state_key: "observation/state"
  camera_keys:
    main: "observation/image"
    wrist: "observation/wrist_image"

rtc:
  action_horizon: 12
  execution_horizon: 6
  initial_delay: 1
  delay_history_length: 8
  max_guidance_weight: 5.0
  num_steps: 10
  late_chunk_behavior: "hold"

control:
  frequency_hz: 30.0
  max_ticks: null
  translation_unit: "m"
  rotation_representation: "rotvec"
  rotation_unit: "rad"
  tcp_delta_frame: "world"
  translation_delta_limit_m: 0.02
  rotation_delta_limit_rad: 0.10
  enable_tcp_delta_limits: false
  # The compact Flexiv dataset stores measured and commanded width in metres.
  gripper_state_range: [0.003, 0.060]
  gripper_command_range: [0.003, 0.060]
  gripper_state_open_at_max: true
  gripper_command_open_at_max: true

flexiv:
  arm: "left"
  is_dummy: false
  task_description: "Pick up the black cylindrical peg and insert it into the hole on the dodecahedral fixture"
  serial_number: "Rizon4-063491"
  gripper_name: "Flexiv-GN01"
  action_representation: "eef_delta"
  control_hz: 30.0
  max_num_steps: 300
  gripper_open_width_m: 0.060
  gripper_close_width_m: 0.003
  gripper_velocity_m_s: 0.03
  gripper_force_n: 25.0
  max_translation_delta_m: 0.02
  max_rotation_delta_rad: 0.10
  cameras:
    main:
      serial_number: "254122302900"
      require_usb3: true
      width: 640
      height: 480
      fps: 30
      crop_width: 320
      crop_height: 320
      crop_offset_x: -20
      crop_offset_y: 90
    wrist:
      serial_number: "250222073667"
      require_usb3: true
      width: 640
      height: 480
      fps: 30
      crop_width: 480
      crop_height: 480
      crop_offset_x: 20
      crop_offset_y: 0
      resize_width: 224
      resize_height: 224
