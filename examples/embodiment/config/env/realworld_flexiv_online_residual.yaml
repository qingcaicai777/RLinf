env_type: real
total_num_envs: 1

auto_reset: false
ignore_terminations: false
reward_mode: raw
wrap_obs_mode: simple
seed: 0
group_size: 1
use_fixed_reset_state_ids: false
max_steps_per_rollout_epoch: 300
max_episode_steps: 300
teleop: spacemouse
no_gripper: false
main_image_key: main

video_cfg:
  save_video: true
  info_on_video: true
  video_base_dir: ${runner.logger.log_path}/video/eval

init_params:
  id: "FlexivOnlineResidualEnv-v1"
  num_envs: null

override_cfg:
  is_dummy: false
  task_description: "complete the configured Flexiv manipulation task"
  serial_number: "REPLACE_WITH_FLEXIV_SERIAL"
  gripper_name: "Flexiv-GN01"
  action_representation: "eef_delta"
  control_hz: 30.0
  max_num_steps: 300
  gripper_open_width_m: 0.060
  gripper_close_width_m: 0.003
  gripper_velocity_m_s: 0.05
  gripper_force_n: 20.0
  max_linear_velocity_m_s: 0.06
  max_angular_velocity_rad_s: 0.20
  max_linear_acceleration_m_s2: 0.15
  max_angular_acceleration_rad_s2: 0.45
  max_translation_delta_m: 0.02
  max_rotation_delta_rad: 0.10
  cameras:
    main:
      serial_number: "REPLACE_WITH_MAIN_CAMERA_SERIAL"
      width: 640
      height: 480
      fps: 30
      crop_width: 224
      crop_height: 224
      crop_offset_x: -50
      crop_offset_y: 40
    wrist:
      serial_number: "REPLACE_WITH_WRIST_CAMERA_SERIAL"
      width: 640
      height: 480
      fps: 30
      crop_width: 480
      crop_height: 480
      crop_offset_x: 20
      crop_offset_y: 0
      resize_width: 224
      resize_height: 224
