defaults:
  - model/pi0_5_rlinf@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor: 0-1

runner:
  task_type: sft
  logger:
    log_path: "../results"
    project_name: rlinf-flexiv-pi05
    experiment_name: "flexiv_sft_openpi_pi05"
    logger_backends: ["tensorboard"]
  max_epochs: -1
  max_steps: 20000
  val_check_interval: -1
  save_interval: 2000

data:
  train_data_paths: "/path/to/flexiv_lerobot_dataset"
  num_workers: 4

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 16
  global_batch_size: 64
  seed: 42
  model:
    model_type: "openpi_rlinf"
    model_path: "/path/to/pi05_base_openpi_rlinf"
    is_lora: false
    num_action_chunks: 12
    action_dim: 7
    add_value_head: false
    num_steps: 10
    openpi_data:
      repo_id: "flexiv_rtc"
      norm_stats_path: "/path/to/flexiv_rtc_assets/norm_stats.json"
    openpi:
      task: sft
      config_name: "pi05_flexiv_rtc"
      num_images_in_input: 2
      train_expert_only: false
      action_horizon: 12
      action_chunk: 12
      action_env_dim: 7
      num_steps: 10
      model_action_dim: 32
      paligemma_variant: "gemma_2b"
      action_expert_variant: "gemma_300m"
      max_token_len: 200
      discrete_state_input: true
      use_rlt: false
  optim:
    lr: 1.0e-5
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-8
    weight_decay: 1.0e-10
    clip_grad: 1.0
    total_training_steps: ${runner.max_steps}
    lr_warmup_steps: 1000
    lr_scheduler: "cosine"
    num_cycles: 0.5
    min_lr: 2.5e-6
