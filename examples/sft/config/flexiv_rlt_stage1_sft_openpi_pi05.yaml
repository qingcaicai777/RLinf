defaults:
  - model/pi0_5_rlinf@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor: 0-1

runner:
  task_type: sft
  logger:
    log_path: "../results"
    project_name: rlinf-flexiv-online-residual
    experiment_name: "flexiv_rlt_stage1_sft_openpi_pi05"
    logger_backends: ["tensorboard"]
  max_epochs: -1
  max_steps: 20000
  val_check_interval: -1
  save_interval: 2000

data:
  # The loader keeps the source immutable and builds each target from future
  # recorded absolute joint positions and gripper states.
  train_data_paths: "/home/mayiqi/projects/data/peg_insertion_joint_absolute_1008"
  num_workers: 4

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  enable_offload: false
  micro_batch_size: 16
  global_batch_size: 64
  seed: 42
  model:
    model_type: "openpi_rlinf"
    model_path: "/home/mayiqi/projects/RLinf/experiments/flexiv_stage1/pi05_base_openpi_rlinf"
    is_lora: false
    # Train the full 32-step flow-matching horizon. Deployment keeps only the
    # first 12 actions for the residual controller and discards the final 20.
    num_action_chunks: 32
    action_dim: 8
    add_value_head: false
    num_steps: 4
    precision: null
    openpi_data:
      repo_id: "flexiv_joint"
      # Generate this file with calculate_flexiv_norm_stats.py. It must describe
      # the same 32-step absolute joint action chunks used by this loader.
      norm_stats_path: "/home/mayiqi/projects/RLinf/experiments/flexiv_stage1/peg_insertion_joint_absolute_1008_v4/norm_stats.json"
    openpi:
      task: sft
      config_name: "pi05_flexiv_joint"
      num_images_in_input: 2
      train_expert_only: false
      action_horizon: 32
      action_chunk: 32
      action_env_dim: 8
      num_steps: 4
      model_action_dim: 32
      paligemma_variant: "gemma_2b"
      action_expert_variant: "gemma_300m"
      max_token_len: 200
      discrete_state_input: true
      use_rlt: true
      rlt_alpha: 1.0
      rlt_input_dim: 2048
      rlt_embed_dim: 2048
      rlt_prefix_seq_len: 1024
      rlt_num_layers: 2
      rlt_num_heads: 8
      rlt_mlp_ratio: 4.0
      rlt_image_only: false
      rlt_use_mask: true
      rlt_decoder_type: "parallel_query"
      rlt_normalized_actions: true
  optim:
    lr: 1.0e-5
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-8
    weight_decay: 1.0e-10
    clip_grad: 1.0
    total_training_steps: ${runner.max_steps}
    lr_warmup_steps: 1000
    lr_scheduler: "cosine"
    num_cycles: 0.5
    min_lr: 2.5e-6
  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "full_shard"
    use_orig_params: true
    save_full_model_weights: true
    gradient_checkpointing: true
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}
