defaults:
  - model/pi0_5_rlinf@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - override hydra/job_logging: stdout
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null

cluster:
  num_nodes: 1
  component_placement:
    actor: 0-0

runner:
  task_type: sft
  logger:
    log_path: "../results"
    project_name: rlinf-flexiv-online-residual
    experiment_name: "flexiv_joint_rlt_stage1_sft_openpi_pi05"
    logger_backends: ["tensorboard"]
  max_epochs: -1
  max_steps: 20000
  val_check_interval: -1
  save_interval: 5000

data:
  # Compact myq single-arm recording with action_representation: joint_absolute.
  # Actions are accepted joint commands in radians followed by gripper width.
  train_data_paths: "/path/to/joint_absolute_demonstrations"
  num_workers: 4

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 16
  global_batch_size: 64
  seed: 42
  model:
    model_type: "openpi_rlinf"
    model_path: "/path/to/pi05_base_openpi_rlinf"
    is_lora: false
    # Train the full 32-step flow-matching horizon. Deployment keeps only the
    # first 12 actions for the residual controller and discards the final 20.
    num_action_chunks: 32
    action_dim: 8
    add_value_head: false
    num_steps: 4
    openpi_data:
      repo_id: "flexiv_joint_absolute"
      # Generate this file with calculate_flexiv_norm_stats.py. It must describe
      # the same 32-step transformed action chunks used by this loader.
      norm_stats_path: "/path/to/flexiv_joint_assets/norm_stats.json"
    openpi:
      task: sft
      config_name: "pi05_flexiv_joint_absolute"
      num_images_in_input: 2
      train_expert_only: false
      action_horizon: 32
      action_chunk: 32
      action_env_dim: 8
      num_steps: 4
      model_action_dim: 32
      paligemma_variant: "gemma_2b"
      action_expert_variant: "gemma_300m"
      max_token_len: 200
      discrete_state_input: true
      use_rlt: true
      rlt_alpha: 1.0
      rlt_input_dim: 2048
      rlt_embed_dim: 2048
      rlt_prefix_seq_len: 1024
      rlt_num_layers: 2
      rlt_num_heads: 8
      rlt_mlp_ratio: 4.0
      rlt_image_only: false
      rlt_use_mask: true
      rlt_decoder_type: "parallel_query"
      rlt_normalized_actions: true
  optim:
    lr: 1.0e-5
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-8
    weight_decay: 1.0e-10
    clip_grad: 1.0
    total_training_steps: 20000
    lr_warmup_steps: 1000
    lr_scheduler: "cosine"
    num_cycles: 0.5
    min_lr: 2.5e-6
  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "no_shard"
    use_orig_params: false
    gradient_checkpointing: false
    mixed_precision:
      param_dtype: null
      reduce_dtype: null
      buffer_dtype: null
